<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂Happy birthday🎂</title>
    <link rel="icon" href="happy.svg" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fafc 0%, #fbc2eb 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1rem 3rem 1rem;
        }

        h1 {
            font-family: 'Segoe Script', cursive;
            font-size: 2.5rem;
            color: #ff4e8e;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            text-shadow: 1px 2px 8px #fff, 0 2px 8px #ffb6b6;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        .movie-card {
            width: 100%;
            height: 25rem;
            background: rgba(255, 255, 255, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 1.2rem;
            padding: 1rem;
            gap: 1rem;
            box-shadow: 0 4px 24px rgba(255, 78, 142, 0.08);
            border: 2px solid #ffe0f7;
            position: relative;
            overflow: hidden;
            transition: box-shadow 0.3s, transform 0.3s;
        }

        .movie-card:hover {
            box-shadow: 0 8px 32px rgba(255, 78, 142, 0.18), 0 0 0 4px #ffb6b6;
            transform: translateY(-8px) scale(1.04) rotate(-1deg);
            background: #fff0fa;
        }

        .movie-card img,
        .movie-card video {
            width: 18rem;
            height: 22rem;
            object-fit: cover;
            border-radius: 0.7rem;
            box-shadow: 0 2px 12px rgba(255, 78, 142, 0.08);
            background: #fff;
        }

        .movie-card video {
            background: #fbc2eb;
        }

        .video-highlight {
            border: 3px solid #ff4e8e;
            box-shadow: 0 0 32px 8px #ffb6b6, 0 0 0 6px #fff0fa;
            z-index: 2;
            transform: scale(1.08) !important;
            animation: video-pop 1.2s cubic-bezier(.68, -0.55, .27, 1.55);
            grid-column: 1 / -1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff0fa;
        }

        .video-highlight video {
            width: 90%;
            height: 28rem;
            max-width: 900px;
            min-width: 220px;
            min-height: 180px;
            background: #fbc2eb;
            border-radius: 1rem;
            box-shadow: 0 4px 32px 0 #ffb6b6;
        }

        @media (max-width: 900px) {
            .video-highlight video {
                width: 98vw;
                height: 40vw;
                min-width: 160px;
                min-height: 120px;
            }
        }

        @keyframes video-pop {
            0% {
                transform: scale(0.8);
                box-shadow: 0 0 0 0 #ffb6b6;
            }

            80% {
                transform: scale(1.12);
                box-shadow: 0 0 32px 12px #ffb6b6;
            }

            100% {
                transform: scale(1.08);
                box-shadow: 0 0 32px 8px #ffb6b6;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }

            .movie-card img,
            .movie-card video {
                width: 90vw;
                height: 50vw;
                min-width: 160px;
                min-height: 120px;
            }

            .movie-card {
                height: auto;
            }
        }
    </style>
</head>

<body>
    <h1>🎉 Birthday Gallery 🎉</h1>
    <div class="gallery-grid">
        <div class="movie-card">
            <img src="./img/b-1.jpg" alt="img...">
        </div>
        <div class="movie-card">
            <img src="./img/b-2.jpg" alt="img..." style="transform: rotate(-90deg);">
        </div>
        <div class="movie-card">
            <img src="./img/b-3.jpg" alt="img..." style="transform: rotate(90deg); object-fit: contain;">
        </div>
        <div class="movie-card">
            <img src="./img/b-4.png" alt="img...">
        </div>
        <!--horizontal card-->
        <div class="movie-card video-highlight">
                <img src="./img/b-19.jpg" alt="img..." style="width: 100%; height: 100%; object-fit: contain; display: block; transform: rotate(90deg);">
        </div>
        <!--horizontal card end-->
        <div class="movie-card">
            <img src="./img/b-5.jpg" alt="img...">
        </div>
        <div class="movie-card">
            <img src="./img/b-6.jpg" alt="img...">
        </div>
        <div class="movie-card">
            <img src="./img/b-7.jpg" alt="img...">
        </div>
        <div class="movie-card">
            <img src="./img/b-8.jpg" alt="img..." style="width: 12rem; height: 20rem;">
        </div>
        <!-- Centered and highlighted video card -->
        <div class="movie-card video-highlight">
            <video controls>
                <source src="./img/b-16.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="movie-card">
            <img src="./img/b-9.jpg" alt="img..." style="width: 12rem; height: 20rem;">
        </div>
        <div class="movie-card">
            <img src="./img/b-10.jpg" alt="img...">
        </div>
        <div class="movie-card">
            <img src="./img/b-11.jpg" alt="img...">
        </div>
        <div class="movie-card">
            <img src="./img/b-12.jpg" alt="img...">
        </div>
                <!--horizontal card-->
        <div class="movie-card video-highlight">
                <img src="./img/b-18.jpg" alt="img..." style="width: 100%; height: 100%; object-fit: contain; display: block; transform: rotate(-90deg);">
        </div>
        <div class="movie-card">
            <img src="./img/b-13.jpg" alt="img...">
        </div>
        <div class="movie-card">
            <img src="./img/b-14.jpg" alt="img..." style=" transform: rotate(-90deg);">
        </div>
        <div class="movie-card">
            <img src="./img/b-15.jpg" alt="img..." style=" transform: rotate(-90deg);">
        </div>
        <div class="movie-card">
            <img src="./img/b-17.jpg" alt="img..." style=" transform: rotate(-90deg);">
        </div>

        <a href="index.html">Back to Home</a>
    </div>
    <script>
        // Music auto-play on page load if coming from NEXT button
        window.addEventListener('DOMContentLoaded', function () {
            let audio;
            if (localStorage.getItem('playMusic') === 'yes') {
                audio = document.createElement('audio');
                audio.src = './hap.mp3';
                audio.autoplay = true;
                audio.loop = false;
                audio.style.display = 'none';
                document.body.appendChild(audio);
            }
            // Pause music when video starts playing, resume when paused or ended
            const video = document.querySelector('.video-highlight video');
            if (video && audio) {
                video.addEventListener('play', function () {
                    audio.pause();
                });
                video.addEventListener('pause', function () {
                    audio.play();
                });
                video.addEventListener('ended', function () {
                    audio.play();
                });
            }
        });
    </script>
</body>

</html>
